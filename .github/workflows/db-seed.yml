name: "DB: Database Seeding & Verification"

# DESTRUCTIVE. `npm run seed` begins by DELETE-ing every table, users included.
#
# This job used to run automatically on any push to main that touched seed.ts,
# data.ts or a module schema, against `secrets.DATABASE_URL || <service
# container>`. The service container was only a fallback, so with the secret
# configured an ordinary schema commit would wipe and re-seed the real database.
#
# It is now pinned to the throwaway Postgres service container below, and only
# ever runs when a human dispatches it and types the confirmation phrase. Do not
# reintroduce a push trigger, and do not point DATABASE_URL at a secret here.
on:
  workflow_dispatch:
    inputs:
      confirm_seed:
        description: 'Type SEED to confirm wiping and re-seeding the throwaway CI database'
        required: true
        default: ''
        type: string

concurrency:
  group: db-seed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    name: Run Database Seeding
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: trailblazers
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      # Deliberately NOT secrets.DATABASE_URL — this job must never be able to
      # reach a real database. The value is the ephemeral service container above.
      DATABASE_URL: 'postgres://postgres:postgrespassword@localhost:5432/trailblazers'

    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ inputs.confirm_seed }}" != "SEED" ]; then
            echo "::error::Refusing to run. Re-dispatch with confirm_seed set to exactly: SEED"
            exit 1
          fi
          echo "Confirmed — seeding the throwaway CI database."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Check Database Connectivity & Health
        run: node scripts/db-health-check.js

      # Tracked migrations, per .agents/rules/code-style.md. `db:push` is
      # forbidden in this repo and was previously used here.
      - name: Apply Migrations
        run: npm run db:migrate

      - name: Execute Database Seed Script
        run: npm run seed

      - name: Post-Seed Health & Record Count Check
        run: node scripts/db-health-check.js

      - name: Output Job Summary
        if: always()
        run: |
          echo "### Database Seeding Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ephemeral CI service container (never a real database)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: manual dispatch by \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Seeded credentials are defined in \`apps/web/src/lib/server/data.ts\` and are for local and CI use only." >> $GITHUB_STEP_SUMMARY
