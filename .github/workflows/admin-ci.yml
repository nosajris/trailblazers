name: "CI: Admin Portal"

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    env:
      CI: true
      VERCEL: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check:admin

      - name: Build
        run: npm run build:admin
