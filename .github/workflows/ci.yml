name: Monorepo Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck-and-build:
    name: Parallel Monorepo Quality Gate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Parallel Monorepo SvelteKit Typecheck
        run: npm run check

      - name: Parallel Monorepo Turborepo Production Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/trailblazers' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci_secret_key_demo' }}
          NODE_ENV: 'production'
