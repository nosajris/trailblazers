name: Web Application CI (@trailblazers/web)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'drizzle/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'drizzle/**'
      - 'package.json'
      - 'turbo.json'

jobs:
  web-typecheck-and-build:
    name: Typecheck & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: SvelteKit Typecheck (@trailblazers/web)
        run: npm run check:web

      - name: Build Web Application (@trailblazers/web)
        run: npm run build:web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/trailblazers' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci_secret_key_demo' }}
          NODE_ENV: 'production'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Verification Tests
        run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/trailblazers' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci_secret_key_demo' }}
