name: "DB: Migrate & Health Check"

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "packages/core/src/db/**"
      - "packages/core/src/modules/**/schema.*"
      - "drizzle.config.ts"
      - "scripts/db-health-check.js"
      - ".github/workflows/db-migrate-health.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Migrations & Health Check
    runs-on: ubuntu-latest
    env:
      CI: true
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not configured — skipping migration"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "✅ DATABASE_URL is set"
          fi

      - name: Setup Node.js
        if: env.SKIP != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: npm ci

      - name: Pre-migration health check
        if: env.SKIP != 'true'
        run: node scripts/db-health-check.js

      - name: Run migrations
        if: env.SKIP != 'true'
        run: npm run db:migrate

      - name: Post-migration health check
        if: env.SKIP != 'true'
        run: node scripts/db-health-check.js
