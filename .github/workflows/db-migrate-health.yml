name: "DB: Migrate & Health Check"

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "packages/core/src/db/**"
      - "packages/core/src/modules/**/schema.*"
      - "drizzle.config.ts"
      - "scripts/db-health-check.js"
      - ".github/workflows/db-migrate-health.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: trailblazers_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      DATABASE_URL: "postgresql://ci:ci_password@localhost:5432/trailblazers_ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pre-migration health check
        run: node scripts/db-health-check.js

      - name: Run migrations
        run: npm run db:migrate

      - name: Post-migration health check
        run: node scripts/db-health-check.js

  deploy-migrations:
    name: Deploy to Production DB
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    env:
      CI: true
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check production DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ DATABASE_URL secret not configured — skipping production migration"
            echo "SKIP_MIGRATION=true" >> $GITHUB_ENV
          fi

      - name: Run production migrations
        if: env.SKIP_MIGRATION != 'true'
        run: npm run db:migrate

      - name: Post-migration health check
        if: env.SKIP_MIGRATION != 'true'
        run: node scripts/db-health-check.js
